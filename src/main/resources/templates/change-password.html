<!DOCTYPE html>
<html layout:decorate="~{shared/layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <title>Change Password</title>
  <link rel="stylesheet" href="/static/css/password.css">

</head>
<body>
<th:block layout:fragment="content">

  <section class="content mt-2">
    <div class="container-fluid">
      <div class="row">
        <div class="col-md-8 mx-auto">
          <div class="card card-outline card-primary">
            <div class="card-header">
              <h2 class="card-title text-primary"><i class="fas fa-key"></i> Change Password</h2>
            </div>
            <div class="card-body">
              <div>
                <span id="error_msg" style="color: red; display: none;"></span>
                <span id="success_msg" style="color: green; display: none;"></span>
              </div>
              <form id="changePasswordForm">
                <div class="form-group">
                  <label for="password">Current Password</label>
                  <div class="input-group">
                    <input type="password" class="form-control input_pass" id="password" name="password"
                           placeholder="Enter current password">
                    <div class="input-group-append">
                      <div class="input-group-text" style="background: white">
                        <button class="show-password toggle-password" type="button"><i class="fa fa-eye"></i></button>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="form-group">
                  <label for="newPassword">New Password</label>
                  <div class="input-group">
                    <input type="password" class="form-control input_pass" id="newPassword" name="newPassword"
                           placeholder="Enter new password">
                    <div class="input-group-append">
                      <div class="input-group-text" style="background: white">
                        <button class="show-password toggle-password" type="button"><i class="fa fa-eye"></i></button>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="form-group">
                  <label for="password2">Confirm New Password</label>
                  <div class="input-group">
                    <input type="password" class="form-control input_pass" id="password2" name="password2"
                           placeholder="Confirm new password">
                    <div class="input-group-append">
                      <div class="input-group-text" style="background: white">
                        <button class="show-password toggle-password" type="button"><i class="fa fa-eye"></i></button>
                      </div>
                    </div>
                  </div>
                </div>
                <button type="submit" class="btn btn-primary">Change Password</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</th:block>
<th:block layout:fragment="script">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/jquery.validate.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/additional-methods.min.js"></script>
  <script src="/static/js/common-validation.js"></script>
  <script src="/static/js/password.js"></script>
  <script src="/static/js/change-password.js"></script>
</th:block>
</body>
