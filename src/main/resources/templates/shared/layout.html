<!DOCTYPE html>
<html xmlns:layout="http://www.utraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <meta content="IE=edge" http-equiv="X-UA-Compatible">

  <title layout:title-pattern="$CONTENT_TITLE | $LAYOUT_TITLE">KGDCL Customer Billing Portal</title>

  <link rel="stylesheet" href="/static/css/payment-footer.css">
  <style th:replace="~{shared/style}"></style>
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

  <div th:replace="~{shared/navbar}"></div>

  <div th:replace="~{shared/sidebar}"></div>

  <!-- Content Wrapper. Contains page content -->
  <div class="content-wrapper">
    <div layout:fragment="content">

    </div>
  </div>
  <!-- /.content-wrapper -->

  <div style="max-height: 20vh" th:replace="~{shared/payment-footer}"></div>
  <div th:replace="~{shared/script}"></div>
  <script src="/static/js/payment-footer.js"></script>
  <div layout:fragment="script">
  </div>
  <script>
    $(document).ready(function () {
      bindSlider();
    });
  </script>
</div>
</body>
</html>
