<!DOCTYPE html>
<html layout:decorate="~{shared/layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <title>Payment Confirmation</title>
</head>
<body>
<th:block layout:fragment="content">
  <section class="content mt-2">
    <div class="container-fluid d-flex justify-content-center align-items-center">
      <div class="col-md-6">
        <div class="payment-summary card shadow"
             th:classappend="${paymentError == null ? 'card-outline card-success' : 'card-danger'}">
          <div class="card-header text-center">
            <div class="payment-icon">
            </div>
            <h4 class="text-bold" id="payment-confirm-msg" th:text="${paymentConfirmation}">
            </h4>
          </div>
          <div class="card-body" id="payment-details">
            <div class="col-md-offset-4">
              <ul class="nav flex-column">
                <li class="nav-item" th:each="entry : ${paymentDetails}">
                  <div class="nav-link text-primary"
                       th:if="${entry.key == 'KGDCLTRANSACTIONREF' || entry.key == 'AMOUNT' || entry.key == 'TRANS_DATE' || entry.key == 'CARD_NUMBER' || entry.key == 'CARDNAME' }">
                    <span th:text="${entry.key + ':'}"></span>
                    <span class="float-right text-dark text-bold" th:text="${entry.value}"></span>
                  </div>
                </li>
                <li class="nav-item" th:if="${paymentError != null}">
                  <div class="nav-link text-danger text-center text-bold">
                    <span th:text="${paymentError}"></span>
                  </div>
                </li>
              </ul>
            </div>
          </div>
          <div class="card-footer">
            <div class="btn-group" role="group">
              <button type="button" class="btn btn-primary float-right" th:if="${paymentError == null}" onclick="downloadReceipt()">
                <i class="fas fa-download"></i> Download
              </button>
              <a class="btn btn-secondary float-right" th:href="@{/profile}">
                <i class="fas fa-home"></i>
                Back to Home
              </a>
            </div>
        </div>

      </div>
    </div>

  </section>
</th:block>
<th:block layout:fragment="script">
  <script src="/static/js/html2pdf/html2pdf.bundle.min.js"></script>
  <script th:inline="javascript">
      function downloadReceipt() {
          const element = document.querySelector('.payment-summary');
          html2pdf(element, {
              margin: 10,
              filename: 'payment_receipt.pdf',
              image: {type: 'jpeg', quality: 0.98},
              html2canvas: {scale: 2},
              jsPDF: {unit: 'mm', format: 'a4', orientation: 'portrait'}
          });
      };
  </script>
</th:block>
</body>
</html>
