<div class="card card-primary card-outline card-outline-tabs">
  <div class="card-header p-0 border-bottom-0">
    <ul class="nav nav-tabs" id="current-bill-info-tab" role="tablist">
      <li class="nav-item">
        <a class="nav-link active" id="meter-regular-tab" data-toggle="pill"
           href="#meter-regular-tabContent" role="tab" aria-controls="meter-regular-tabContent"
           aria-selected="false">Meter Regular</a>
      </li>
      <li class="nav-item">
        <a class="nav-link " id="meter-partial-tab" data-toggle="pill"
           onclick="meterPartialBill(), meterPartialBillDetails()"
           href="#meter-partial-tabContent" role="tab" aria-controls="meter-partial-tabContent"
           aria-selected="true">Meter Installment</a>
      </li>
    </ul>
  </div>
  <div>
    <div class="card-body">
      <div class="tab-content" id="current-bill-info-tabContent">
        <div class="tab-pane fade active show" id="meter-regular-tabContent" role="tabpanel"
             aria-labelledby="meter-regular-tab">
          <div class="text-left">
            <div class="overlay">
              <i class="fa-3x fas fa-spinner fa-spin"></i>
            </div>
            <div class="inner">
              <div id="descriptionList" class="row">
              </div>
            </div>
            <div id="pay-regular">
            </div>
          </div>
          <div id="meterTable" class="col-sm-12 shadow">
            <table id="billDetailsTable"
                   class="table table-sm table-view table-responsive-sm table-striped table-hover table-bordered"
                   style="width: 100%"></table>
          </div>
        </div>
        <div class="tab-pane fade" id="meter-partial-tabContent" role="tabpanel"
             aria-labelledby="meter-partial-tab">
          <div class="text-left">
            <div class="overlay">
              <i class="fa-3x fas fa-spinner fa-spin"></i>
            </div>
            <div class="inner ">
              <div id="partialDesc" class="row justify-content-center">
              </div>
            </div>
            <div id="pay-partial">
            </div>
            <table id="partialDetailsTable"
                   class="table table-sm table-view table-responsive-sm table-striped table-hover table-bordered"
                   style="width: 100%"></table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
