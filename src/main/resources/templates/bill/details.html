<!DOCTYPE html>
<html layout:decorate="~{shared/layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <title>Bill Details</title>
</head>
<body>
<th:block layout:fragment="content">
  <section class="content mt-2">
    <div class="container-fluid">
      <div class="row" id="meterBill">
        <div class="col-md-12">
          <div class="card card-outline card-primary">
            <div class="card-header">
              <h2 class="card-title text-primary"><i class="fas fa-money-bill-wave"></i> Current Bill Info</h2>
            </div>
            <div class="card-body">
              <div th:replace="${isNonMeterCustomer} ? ~{bill/non-meter} : ~{bill/metered}"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</th:block>
<th:block layout:fragment="script">
  <script th:inline="javascript">
      var isNonMeterCustomer = /*[[${isNonMeterCustomer}]]*/ false;
  </script>
  <script th:src="@{/static/js/bill/details.js}"></script>
</th:block>
</body>
</html>
