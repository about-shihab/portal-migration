<!DOCTYPE html>
<html layout:decorate="~{shared/layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Application for reconnection</title>
</head>
<body>
<th:block layout:fragment="content">
    <section class="content mt-2">
        <div class="container-fluid">
            <div class="row justify-content-center">
                <div class="col-md-12">
                    <div class="card card-primary card-outline">
                        <div class="card-header">
                            <h3 class="card-title text-primary">
                                <i class="nav-icon fas fa-gas-pump"></i>
                                Application for Reconnection
                            </h3>
                        </div>
                        <div class="card-body">
                            <div th:if="${isImpersonating}" class="alert alert-warning mb-4">
                                <i class="fas fa-exclamation-triangle"></i>
                                You are currently impersonating a user. You cannot submit a reconnection application
                                while impersonating.
                            </div>
                            <div id="msg-section">
                                <div th:if="${!msg.isEmpty()}"
                                     th:classappend="${msg.contains('success') ? 'alert alert-success' : 'alert alert-danger'}">
                                    <i th:class="${msg.contains('success') ? 'fas fa-check-circle' : 'fas fa-exclamation-triangle'}"></i>
                                    <span th:text="${msg}"></span>
                                </div>
                            </div>
                            <form th:if="${msg.isEmpty() && reconnectionApplication == null}"
                                  th:action="@{/reconnection/request}"
                                  enctype="multipart/form-data" method="post" id="reconnectionForm">
                                <div class="table-responsive col-md-8 offset-md-2 text">
                                    <div th:utext="${reconnectionContentHtml}"></div>
                                    <p class="card-text mb-2 col-md-3">সংযুক্তিঃ<span class="text-danger">*</span></p>
                                    <div class="form-group">
                                        <div class="custom-file">
                                            <input type="file" class="custom-file-input" name="billFile" id="billFile"
                                                   required>
                                            <label class="custom-file-label text-sm" for="billFile">বিলের কপি আপলোড
                                                করুন</label>
                                        </div>
                                    </div>
                                    <input type="submit" value="সাবমিট" class="mt-2 btn btn-success btn-block">
                                </div>
                            </form>
                            <div th:if="${reconnectionApplication != null}" class="mt-1">
                                <div th:replace="reconnection-app-details"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</th:block>
<th:block layout:fragment="script">
    <script src="https://cdn.jsdelivr.net/npm/bs-custom-file-input@1.3.4/dist/bs-custom-file-input.min.js"></script>
    <script>
        $(document).ready(function () {
            bsCustomFileInput.init();
        });
    </script>
</th:block>
</body>
