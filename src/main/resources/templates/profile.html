<!DOCTYPE html>
<html layout:decorate="~{shared/layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <title>Profile</title>
</head>
<body>
<th:block layout:fragment="content">
  <section class="content mt-2">
    <div class="container-fluid">
      <div class="row justify-content-center">
        <div class="col-md-12">
          <div class="card card-outline card-purple">
            <div class="card-header">
              <h2 class="card-title text-purple"><i class="fas fa-user"></i> Customer Information</h2>
            </div>
            <div class="card-body">
              <dl class="row">
                <dt class="col-sm-4">Customer Name</dt>
                <dd class="col-sm-8" id="custName"></dd>

                <dt class="col-sm-4">Customer Type</dt>
                <dd class="col-sm-8" id="custType"></dd>

                <dt class="col-sm-4">Zone</dt>
                <dd class="col-sm-8" id="zone"></dd>

                <dt class="col-sm-4">Customer Code</dt>
                <dd class="col-sm-8" id="custCode"></dd>

                <dt class="col-sm-4">Customer Old Code</dt>
                <dd class="col-sm-8" id="oldCode"></dd>

                <dt class="col-sm-4">Registered Mobile Number</dt>
                <dd class="col-sm-8" id="phoneNo"></dd>

                <dt class="col-sm-4">Billing Address</dt>
                <dd class="col-sm-8" id="billingAdd"></dd>

                <dt class="col-sm-4">Connection Status</dt>
                <dd class="col-sm-8" id="connStatus"></dd>
              </dl>
            </div>
          </div>
        </div>
      </div>
      <div class="row justify-content-center" id="appliances-info">
        <div class="col-md-12">
          <div class="card card-outline card-primary">
            <div class="card-header">
              <h2 class="card-title text-primary"><i class="fas fa-gas-pump"></i>
                <span id="appliance-info-title">
                Appliances Information
                </span></h2>
            </div>
            <div class="card-body">
              <div id="appliance-info"></div>
              <div id="meter-info"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</th:block>
<th:block layout:fragment="script">
  <script src="/static/js/profile.js"></script>
</th:block>
</body>
