app.version=@project.version@

server.port=${KGDCL_PORTAL_SERVER_PORT}
server.servlet.session.timeout=15m

# Thymeleaf configurations
spring.thymeleaf.cache=true
spring.thymeleaf.enabled=true
spring.thymeleaf.check-template=true
spring.thymeleaf.check-template-location=true
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.servlet.content-type=text/html
server.error.whitelabel.enabled=false

#### DB Config
spring.datasource.jdbcUrl=${KGDCL_PORTAL_DB_URL}
spring.datasource.username=${KGDCL_PORTAL_DB_USERNAME}
spring.datasource.password=${KGDCL_PORTAL_DB_PASSWORD}

#### JDBC Pool Config
spring.datasource.tomcat.initial-size=15
spring.datasource.tomcat.max-wait=20000
spring.datasource.tomcat.max-active=50
spring.datasource.tomcat.max-idle=15
spring.datasource.tomcat.min-idle=8
spring.datasource.tomcat.default-auto-commit=true

spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver
spring.jpa.hibernate.naming-strategy=org.hibernate.cfg.ImprovedNamingStrategy
spring.jpa.show-sql=false
#server.servlet.context-path=/customerPortal
spring.jpa.properties.hibernate.dialect=${DB_HIBERNATE_DIALECT}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.proc.param_null_passing=true

jwt.token.secret=${KGDCL_PORTAL_JWT_TOKEN_SECRET}
# The header we are going to use for authentication
jwt.auth.header=Authorization
# After how many hours the token will expire
jwt.expire.minutes=1440
jwt.expire.hours=5

verification.expire.minutes=15
# user link expiration in minutes
user.expiration=15

spring.mail.host=${KGDCL_PORTAL_MAIL_HOST}
spring.mail.username=${KGDCL_PORTAL_MAIL_USERNAME}
spring.mail.password=${KGDCL_PORTAL_MAIL_PASSWORD}
spring.mail.port=${KGDCL_PORTAL_MAIL_PORT}
spring.mail.tls=true
spring.mail.isAuth=true
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.starttls.enable=true
# Session cookie configuration
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.same-site=None
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.path=/

# SSL
server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:keystore/kgdcl-portal.p12
server.ssl.key-store-password=${KGDCL_PORTAL_SSL_KEYSTORE_PASSWORD}
server.ssl.key-alias=kgdcl-portal
server.ssl.enabled=true

# properties for external api
collection-server=${COLLECTION_SERVER_URL}
collection-server-basic-auth=${COLLECTION_SERVER_BASIC_AUTH}
erp-server=${ERP_SERVER_URL}
erp-server-basic-auth=${ERP_SERVER_BASIC_AUTH}

dbbl-soap-url=${DBBL_SOAP_URL}
dbbl-soap-username=${DBBL_SOAP_USERNAME}
dbbl-soap-password=${DBBL_SOAP_PASSWORD}
dbbl-gateway-client-url=${DBBL_GATEWAY_CLIENT_URL}
dbbl-collection-basic-auth=${DBBL_COLLECTION_BASIC_AUTH}

file.upload-dir=${KGDCL_PORTAL_FILE_UPLOAD_DIR}
report.base-dir=${KGDCL_PORTAL_REPORT_BASE_DIR}

external.api-auth-header=${KGDCL_PORTAL_EXTERNAL_API_AUTH_HEADER}

# Hikari CP Settings
spring.datasource.hikari.minimumIdle=5
spring.datasource.hikari.maximumPoolSize=20
spring.datasource.hikari.idleTimeout=30000
spring.datasource.hikari.poolName=SpringBootJPAHikariCP
spring.datasource.hikari.maxLifetime=2000000
spring.datasource.hikari.connectionTimeout=30000
spring.datasource.hikari.leak-detection-threshold=21000

logging.level.com.zaxxer.hikari=debug
